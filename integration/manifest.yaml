manifest_version: "1"
contract_version: "1"

agent:
  id: meeting-summary-agent
  display_name: "Meeting Summary Agent"
  version: "1.0.0"
  description: >
    Generates AI meeting summaries and topic sections from transcripts, writing results back to the Django REST API.

capabilities:
  - read
  - write

jobs:
  - name: summary_generation
    display_name: "Agent"
    actions:
      - start
      - soft_stop
      - hard_stop
      - manual_ping
      - manual_run
      - run

entrypoints:
  service: integration.server:flask_app
  integration: integration.server:flask_app
